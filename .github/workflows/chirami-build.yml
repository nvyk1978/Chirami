name: Build Chirami APK

on:
  push:
    branches:
      - main
    paths:
      - source.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source.zip
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q source.zip -d build_src
          test -f build_src/settings.gradle
          test -f build_src/app/build.gradle

      - name: Build debug APK
        working-directory: build_src
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp build_src/app/build/outputs/apk/debug/app-debug.apk output/Chirami-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chirami-debug
          path: output/Chirami-debug.apk
          if-no-files-found: error
          retention-days: 14
