name: Build Chirami APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.zip
      - .github/workflows/chirami-build-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source.zip
        run: |
          rm -rf build_src output
          mkdir -p build_src output
          unzip -q source.zip -d build_src
          test -f build_src/settings.gradle
          test -f build_src/app/build.gradle
          test -f build_src/app/src/main/AndroidManifest.xml

      - name: Read and verify source version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" build_src/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p" build_src/app/build.gradle | head -n 1)

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          APK_NAME="Chirami-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          ARTIFACT_NAME="Chirami-${VERSION_NAME}-${VERSION_CODE}-debug-apk"
          RELEASE_TAG="chirami-${VERSION_NAME}-${VERSION_CODE}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Source version: $VERSION_NAME ($VERSION_CODE)"
          echo "Output APK: $APK_NAME"

      - name: Build debug APK
        working-directory: build_src
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK internal version and collect
        shell: bash
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
        run: |
          APK_SRC="build_src/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -f "$APK_SRC"
          test -x "$AAPT"

          BADGING=$("$AAPT" dump badging "$APK_SRC" | head -n 1)
          echo "$BADGING"

          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"

          cp "$APK_SRC" "output/$APK_NAME"
          test -f "output/$APK_NAME"
          sha256sum "output/$APK_NAME" | tee output/SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_version.outputs.artifact_name }}
          path: |
            output/${{ steps.app_version.outputs.apk_name }}
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish raw APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app_version.outputs.release_tag }}
          APK_PATH: output/${{ steps.app_version.outputs.apk_name }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "Chirami ${VERSION_NAME} (${VERSION_CODE})" \
              --notes "Automated debug APK build: ${APK_NAME}" \
              --prerelease
          fi

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Chirami APK"
            echo
            echo "**Version:** ${{ steps.app_version.outputs.version_name }} (${{ steps.app_version.outputs.version_code }})"
            echo "**APK:** ${{ steps.app_version.outputs.apk_name }}"
            echo
            echo "Actions Artifact downloads as ZIP by GitHub design."
            echo "Raw APK: https://github.com/${{ github.repository }}/releases/tag/${{ steps.app_version.outputs.release_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
